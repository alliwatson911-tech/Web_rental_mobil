# ==============================================================================
# Google Cloud Build Pipeline - Padaidi Rent Car
# Build Docker image & Deploy automatically to Google Cloud Run (Jakarta Region)
# ==============================================================================

steps:
  # Step 1: Build the Docker image in the cloud
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/padaidi-repo/padaidi-web:$SHORT_SHA'
      - '-t'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/padaidi-repo/padaidi-web:latest'
      - '.'

  # Step 2: Push Docker image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/padaidi-repo/padaidi-web'

  # Step 3: Deploy container to Google Cloud Run (Serverless, Auto-scaling)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'padaidi-web'
      - '--image'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/padaidi-repo/padaidi-web:$SHORT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/padaidi-repo/padaidi-web:$SHORT_SHA'
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/padaidi-repo/padaidi-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY

