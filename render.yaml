services:
  - type: web
    name: padaidi-rent-car
    runtime: docker
    plan: free
    region: singapore
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Padaidi Rent Car"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:LYVOj6jWrySKfgsE96O1+SM3CFzJog2AlWSC2+ovXv0="
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_TIMEZONE
        value: Asia/Makassar
      - key: APP_LOCALE
        value: id
      - key: APP_URL
        value: "https://padaidirentcar.onrender.com"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: public
